name: Build iOS (IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'android/**'
      - '**.md'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS JSBundle
        run: npm run bundle-ios

      - name: Build iOS Archive (Unsigned)
        run: |
          cd ios
          xcodebuild -workspace LxMusicMobile.xcworkspace \
            -scheme LxMusicMobile \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/LxMusicMobile.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build_output/Payload
          cp -r ios/build/LxMusicMobile.xcarchive/Products/Applications/LxMusicMobile.app build_output/Payload/
          cd build_output
          zip -r MeloRiver-iOS-v1.9.1.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeloRiver-iOS-v1.9.1-IPA
          path: build_output/MeloRiver-iOS-v1.9.1.ipa
